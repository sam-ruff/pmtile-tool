name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GO_PMTILES_VERSION: 1.30.3
  GO_PMTILES_SHA256: adda9f979b719416d0c0069f57401a21c32078c46870a94f9bbda95d850f199f
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Build the embedded UI so build.rs bakes it into the binary, matching
      # what ships.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend into static
        run: ./scripts/sync-ui.sh

      - name: Test release identity without credentials
        run: pnpm install --frozen-lockfile && pnpm test:release

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Cache cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.96.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.96.0-

      - name: Formatting
        run: cargo +1.96.0 fmt --check

      - name: Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo +1.96.0 test --locked

      - name: Fetch go-pmtiles for the e2e suite
        run: |
          mkdir -p bin
          archive="$RUNNER_TEMP/go-pmtiles.tar.gz"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${GO_PMTILES_VERSION}/go-pmtiles_${GO_PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            --output "$archive"
          echo "$GO_PMTILES_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C bin pmtiles

      - name: End-to-end extract pipeline
        run: cargo +1.96.0 test --locked --test e2e_extract -- --ignored

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (mock mode)
        run: pnpm test:e2e

  release:
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.17.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Capture released version
        id: ver
        run: echo "version=${RELEASE_VERSION:-}" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    # The lab runner pool: it can reach the private registry, which GitHub-hosted runners cannot.
    runs-on: [self-hosted, sophie]
    timeout-minutes: 60
    env:
      REGISTRY: registry.tail2d6fbe.ts.net
      IMAGE: registry.tail2d6fbe.ts.net/pmtile-tool/pmtile-tool
      VERSION: ${{ needs.release.outputs.version }}
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compute tags
        run: echo "MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_ENV"

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push image
        run: |
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" --build-arg VERSION="$VERSION" \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR_MINOR" -t "$IMAGE:sha-$GIT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$MAJOR_MINOR"
          docker push "$IMAGE:sha-$GIT_SHA"
