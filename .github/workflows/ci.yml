name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GO_PMTILES_VERSION: 1.31.2
  GO_PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: [self-hosted, sophie]
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Build the embedded UI so build.rs bakes it into the binary, matching
      # what ships.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend into static
        run: ./scripts/sync-ui.sh

      - name: Test release identity without credentials
        run: pnpm install --frozen-lockfile && pnpm test:release

      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.100.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.100.0-

      - name: Formatting
        run: cargo +1.100.0 fmt --check

      - name: Clippy
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo +1.100.0 test --locked

      - name: Fetch go-pmtiles for the e2e suite
        run: |
          mkdir -p bin
          archive="$RUNNER_TEMP/go-pmtiles.tar.gz"
          curl --fail --show-error --location --retry 3 \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${GO_PMTILES_VERSION}/go-pmtiles_${GO_PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            --output "$archive"
          echo "$GO_PMTILES_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C bin pmtiles

      - name: End-to-end extract pipeline
        run: cargo +1.100.0 test --locked --test e2e_extract -- --ignored

  frontend-tests:
    runs-on: [self-hosted, sophie]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (mock mode)
        run: pnpm test:e2e

  release:
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, sophie]
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: publish_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Capture released version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: node scripts/verify-release.cjs

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    # The lab runner pool: it can reach the private registry, which GitHub-hosted runners cannot.
    runs-on: [self-hosted, sophie]
    timeout-minutes: 60
    env:
      REGISTRY: registry.tail2d6fbe.ts.net
      IMAGE: registry.tail2d6fbe.ts.net/pmtile-tool/pmtile-tool
      VERSION: ${{ needs.release.outputs.version }}
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compute tags
        run: echo "MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_ENV"

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push image
        run: |
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" --build-arg VERSION="$VERSION" \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR_MINOR" -t "$IMAGE:sha-$GIT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$MAJOR_MINOR"
          docker push "$IMAGE:sha-$GIT_SHA"
